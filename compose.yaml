services:
  url-reader-app:
    build:
      context: .
      dockerfile: Dockerfile.reader
    image: url-reader-app:latest
    hostname: url-reader-app # do NOT change this, it is used in the main.py file
    # This hostname is used to access the app from the server container
    # and should match the READER_BASE_URL in main.py
    # If you change this, also update the READER_BASE_URL in main.py
    container_name: url-reader-app
    # Expose the reader directly for debugging, e.g.
    #   curl -H 'X-Respond-With: screenshot' -o shot.png \
    #        'http://127.0.0.1:3000/https://example.com/'
    # (the openapi/python wrapper is the normal entry point; see url-reader-server).
    ports:
      - "3000:3000"
    # Headless Chrome writes a lot to /dev/shm. Without this it crashes on pages
    # that use SharedArrayBuffer or render many layers, and the reader answers 500.
    shm_size: "1gb"
    volumes:
      - ./screenshots:/app/local-storage
    restart: always
    environment:
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/google-chrome-stable"
    command: node build/server.js
    networks:
      - default

  url-reader-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: url-reader-server:latest
    hostname: url-reader-server
    container_name: url-reader-server
    # Debug endpoints live here: /debug/status and /screenshot/<url>?debug=1
    ports:
      - "8000:8000"
    restart: always
    depends_on:
      - url-reader-app
    volumes:
      - ./main.py:/app/main.py
      - ./screenshots:/app/screenshots
    networks:
      - default
      - chatwebui

networks:
  chatwebui:
    external: true
