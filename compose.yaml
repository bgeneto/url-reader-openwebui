services:
  url-reader-app:
    build:
      context: .
      dockerfile: Dockerfile.reader
    image: url-reader-app:latest
    hostname: url-reader-app # do NOT change this, it is used in the main.py file
    # This hostname is used to access the app from the server container
    # and should match the READER_BASE_URL in main.py
    # If you change this, also update the READER_BASE_URL in main.py
    container_name: url-reader-app
    # Deliberately NOT published: this service only needs to be reachable by
    # url-reader-server over the internal docker network. For a one-off manual
    # check, run a shell inside the network instead of exposing a port:
    #   docker run --rm --network url-reader_default curlimages/curl:latest \
    #     -s -o /dev/null -w '%{http_code}\n' -H 'X-Respond-With: screenshot' \
    #     'http://url-reader-app:3000/https://example.com/'
    # Headless Chrome writes a lot to /dev/shm. Without this it crashes on pages
    # that use SharedArrayBuffer or render many layers, and the reader answers 500.
    shm_size: "1gb"
    volumes:
      - ./screenshots:/app/local-storage
    restart: always
    environment:
      # Point Puppeteer at the Debian `chromium` package (already installed by
      # Dockerfile.reader) rather than `google-chrome-stable`, which is the
      # binary that dies during launch here:
      #   TargetCloseError: Protocol error (Target.setDiscoverTargets): Target closed
      # PuppeteerControl emits an unhandled 'error' event for that, so the whole
      # Node process exits -> restart loop -> every crawl answers 500 in ~0.25s.
      # Switch back to "/usr/bin/google-chrome-stable" if this one misbehaves.
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
    command: node build/server.js
    networks:
      - default

  url-reader-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    image: url-reader-server:latest
    hostname: url-reader-server
    container_name: url-reader-server
    # Also not published. Open WebUI reaches it as http://url-reader-server:8000
    # on the shared `chatwebui` network, and the debug endpoints (/debug/status,
    # /debug/reader) can be reached the same way from any container on it, e.g.
    #   docker run --rm --network chatwebui curlimages/curl:latest \
    #     -s 'http://url-reader-server:8000/debug/status'
    restart: always
    depends_on:
      - url-reader-app
    volumes:
      - ./main.py:/app/main.py
      - ./screenshots:/app/screenshots
    networks:
      - default
      - chatwebui

networks:
  chatwebui:
    external: true
